name: Release after merge

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: fragment-release
      cancel-in-progress: false
      queue: max
    steps:
      # Only trusted main is executed, never the PR head (including fork PRs).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install build tools
        run: npm install --global pnpm@12.4.1 sfw@2.0.6
      - name: Publish binaries and update the tap
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ github.event.pull_request.number }}
        run: bash scripts/publish-release.sh
